{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="empty-state py-5">
    <div class="d-inline-flex p-3 bg-danger bg-opacity-10 text-danger rounded-4 mb-3">
        <i data-lucide="alert-octagon" style="width: 48px; height: 48px;"></i>
    </div>
    <h3 class="fw-bold mb-2">500 - Internal Server Error</h3>
    <p class="text-muted small mb-4">An unexpected system condition occurred while processing your request.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-sm btn-primary">Return to Overview</a>
</div>
{% endblock %}
