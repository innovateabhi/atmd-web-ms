{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="empty-state py-5">
    <div class="d-inline-flex p-3 bg-warning bg-opacity-10 text-warning rounded-4 mb-3">
        <i data-lucide="shield-alert" style="width: 48px; height: 48px;"></i>
    </div>
    <h3 class="fw-bold mb-2">403 - Access Forbidden</h3>
    <p class="text-muted small mb-4">You do not possess the required permissions to access this administrative resource.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-sm btn-primary">Return to Overview</a>
</div>
{% endblock %}
